name: production-gate

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - run: uv run python scripts/check_release_contracts.py
      - run: uv run ruff format --check src tests scripts
      - run: uv run ruff check src tests scripts
      - run: uv run mypy --strict src/repoforge
      - run: uv run python scripts/select_affected_tests.py --check-completeness
      - run: uv run python scripts/test_catalog.py --check tests/catalog.toml
      - name: Record exact HEAD and require tracked cleanliness
        run: |
          git rev-parse HEAD
          git diff --exit-code
          git diff --cached --exit-code

  affected-tests:
    if: github.event_name == 'pull_request'
    needs: [static-contracts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - name: Changed package modules remain selectable
        run: |
          uv run python scripts/select_affected_tests.py \
            --check-map-freshness --base "origin/${{ github.base_ref }}"
      - name: Affected tests and shadow catalog
        run: |
          uv run python scripts/select_affected_tests.py \
            --run --base "origin/${{ github.base_ref }}" \
            --shadow-catalog tests/catalog.toml \
            --report-path .cache/verification/affected.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: affected-verification
          path: .cache/verification/affected.json
          if-no-files-found: warn

  canonical-coverage:
    if: github.event_name != 'pull_request'
    needs: [static-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - name: Canonical full branch coverage
        run: make coverage
      - name: Coverage map from canonical observations
        env:
          COVERAGE_FILE: .cache/verification/coverage/.coverage
        run: make test-map-check-existing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-coverage-evidence
          path: |
            .cache/verification/coverage/.coverage
            .cache/verification/coverage.json
          if-no-files-found: warn

  compatibility:
    if: github.event_name != 'pull_request'
    needs: [static-contracts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - name: Reviewed compatibility subset without coverage
        env:
          REPOFORGE_CI_FULL_MATRIX: ${{ vars.REPOFORGE_CI_FULL_MATRIX || '0' }}
        run: uv run python scripts/run_compatibility_tests.py

  live-activation:
    needs: [static-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - name: Live activation, second activation, and receipted rollback
        run: scripts/live-activation-sandbox.sh

  package:
    if: always() && needs.static-contracts.result == 'success' && needs.live-activation.result == 'success'
    needs: [static-contracts, live-activation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - run: uv build
      - run: scripts/verify-wheel-install.sh dist
      - name: Ensure build did not rewrite tracked files
        run: git diff --exit-code

  production-gate:
    if: always()
    needs:
      [static-contracts, affected-tests, canonical-coverage, compatibility, live-activation, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require the event-specific verification topology
        run: |
          set -eu
          status=0
          for entry in \
            'static-contracts=${{ needs.static-contracts.result }}' \
            'live-activation=${{ needs.live-activation.result }}' \
            'package=${{ needs.package.result }}'; do
            name=${entry%%=*}
            result=${entry#*=}
            printf '%-20s %s\n' "$name" "$result"
            [ "$result" = success ] || status=1
          done

          affected='${{ needs.affected-tests.result }}'
          coverage='${{ needs.canonical-coverage.result }}'
          compatibility='${{ needs.compatibility.result }}'
          printf '%-20s %s\n' affected-tests "$affected"
          printf '%-20s %s\n' canonical-coverage "$coverage"
          printf '%-20s %s\n' compatibility "$compatibility"

          if [ '${{ github.event_name }}' = pull_request ]; then
            [ "$affected" = success ] || status=1
            [ "$coverage" = skipped ] || status=1
            [ "$compatibility" = skipped ] || status=1
          else
            [ "$affected" = skipped ] || status=1
            [ "$coverage" = success ] || status=1
            [ "$compatibility" = success ] || status=1
          fi
          exit "$status"
