name: production-gate

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - run: uv run python scripts/check_release_contracts.py
      - run: uv run ruff format --check src tests scripts
      - run: uv run ruff check src tests scripts
      - run: uv run mypy --strict src/repoforge
      # Manifest completeness + coverage-map staleness (map must not reference
      # deleted/renamed test files). The full suite still runs below, so this is
      # a fast correctness guard on the test-selection metadata, not a gate on
      # the map being perfectly fresh.
      - run: uv run python scripts/select_affected_tests.py --check-completeness
      - name: Record exact HEAD and require tracked cleanliness
        run: |
          git rev-parse HEAD
          git diff --exit-code
          git diff --cached --exit-code

  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: selecting affected tests diffs against the base branch, and a
          # shallow clone has no merge base to diff from.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - name: Guided onboarding real-Git regressions
        run: uv run pytest tests/test_onboarding_real_git.py tests/test_repository_discovery.py
      # A pull request runs only the tests its own changes can affect. The selector fails
      # closed: an always-wide path, a package module missing from the coverage map, or any
      # unmapped path escalates to the whole suite, so a narrow run is only ever a run it
      # could justify. Coverage is deliberately not enforced here -- a subset cannot meet a
      # whole-repository threshold, and pretending otherwise would make the number a lie.
      - name: Affected tests (pull request)
        if: github.event_name == 'pull_request'
        run: |
          uv run python scripts/select_affected_tests.py \
            --run --base "origin/${{ github.base_ref }}"
      # Every push to a protected branch still runs everything with coverage. This is what
      # keeps the narrow PR run honest: a cross-module regression a stale coverage map failed
      # to select is caught here, before it can be built into a release.
      - name: Full suite with coverage (push)
        if: github.event_name != 'pull_request'
        run: uv run pytest --cov=repoforge --cov-branch --cov-report=term-missing

  # A release gate that no unit test can replace: it performs a REAL `rf upgrade
  # --activate` (real wheel build, real per-release venv, real smoke, real supervisor
  # process), a second activation, and a receipted rollback, asserting the JSON payloads
  # and `rf version status` at every stage. Five production defects reached `main`-bound
  # branches invisible to the unit suite and were caught only here, so this runs on the
  # gate rather than on demand.
  live-activation:
    needs: [static-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - name: Live activation, second activation, and receipted rollback
        # The harness provisions its own stub tunnel-client and an isolated HOME, config,
        # state root and release root, so it never contacts a control plane and never
        # touches an installation outside its sandbox.
        run: scripts/live-activation-sandbox.sh

  package:
    # `live-activation` is a dependency, not just a sibling: a DAG where the live gate
    # fails while `package` still succeeds is a valid DAG, so any branch rule that
    # requires only `package` would let a broken activation merge.
    needs: [static-contracts, tests, live-activation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - run: uv build
      - run: scripts/verify-wheel-install.sh dist
      - name: Ensure build did not rewrite tracked files
        run: git diff --exit-code

  # THE required check. One stable name that fails unless every job above succeeded, so
  # adding a job to this workflow can never silently fall outside the gate: `if: always()`
  # means this job runs even when a dependency failed or was skipped, and an explicitly
  # asserted `success` for each result is what makes a skipped job a failure here too.
  # Branch protection should require `production-gate` and nothing else.
  production-gate:
    if: always()
    needs: [static-contracts, tests, live-activation, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate job to have succeeded
        run: |
          set -eu
          status=0
          for entry in \
            'static-contracts=${{ needs.static-contracts.result }}' \
            'tests=${{ needs.tests.result }}' \
            'live-activation=${{ needs.live-activation.result }}' \
            'package=${{ needs.package.result }}'; do
            name=${entry%%=*}
            result=${entry#*=}
            printf '%-18s %s\n' "$name" "$result"
            [ "$result" = success ] || status=1
          done
          exit "$status"
