repos:
  - repo: local
    hooks:
      - id: ruff-format-stage
        name: ruff format
        entry: bash -c 'ruff format "$@"; git add -u'
        language: system
        types: [python]
        pass_filenames: false
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: local
    hooks:
      # Not restricted to `types: [python]`: the marker that reached `main` was in
      # Markdown, which no other hook here looks at.
      - id: conflict-markers
        name: conflict markers
        entry: python3 scripts/check_conflict_markers.py
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        args: [--strict]
        pass_filenames: false
        require_serial: true
