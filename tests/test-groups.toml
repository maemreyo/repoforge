[groups.platform]
description = "Cross-cutting agent-facing subsystems that do not map to a single domain above: onboarding, skills, code intelligence, audit/observability, generic CLI/service composition."
# parallel = true: this catch-all owns a few git-heavy files
# (test_plan_execution.py, test_background_run_profile.py) but they are
# tmp_path-isolated and xdist-safe. Serializing all 40 files to protect 2 is
# a net time loss; their contention flakiness is addressed by the raised
# pytest --timeout (see contracts note), not by the serial lane.
parallel = true
