# Minimal RepoForge source configuration. `rf setup` creates this file for you.
# Provider manifests are enrolled separately into reviewed immutable configuration;
# this editable source file cannot grant provider capabilities.
version = 2

# Omit [tunnel] for local-only stdio operation.
[tunnel]
id = "tunnel_replace_me"
profile = "repoforge"
# tunnel-client recycles the MCP transport on its own schedule -- 10 minutes at the time of
# writing -- and on expiry shuts the client down rather than reconnecting the stdio child.
# Each teardown is a window where the connector answers 502 and any synchronous call in
# flight is lost; durable work survives, because an operation is admitted before the call
# returns and an identical retry joins the run already going. Raising this makes the recycle
# rarer, it does not remove it. It lives here rather than under [server] because [server] is
# read once at setup and then frozen; these are re-read from source on every runtime start.
# mcp_connection_max_ttl_seconds = 3600

# The GitHub ticket-graph cache is fail-closed by default: RepoForge never reads
# credentials, so it cannot prove the ambient GitHub authority is unchanged between a
# cache write and a later read. An auth-issued fingerprint is only produced by the trust
# boundary that owns the credential lifecycle (the live token/installation generation
# plus the reviewed permission scope); a static profile hash is never a generation. This
# manual digest is the explicit legacy mode: pin it to an opaque 64-hex-char digest naming
# the current credential generation and rotate it whenever that authority changes.
# Leave it unset to keep the graph cache disabled until a generation provider is wired.
# [server]
# github_read_cache_authority_digest = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

# Auth profiles pin a reviewed actor and transport without storing raw tokens or keys.
# `credential_reference` names an external account; the environment name is resolved only
# when an operation acquires a short-lived lease. Add one table per operator or automation
# identity and keep repository patterns inside a single reviewed owner boundary.
# [auth_profiles.personal]
# provider = "github"
# credential_kind = "stored_account"
# credential_reference = "gh-account-personal"
# actor_class = "human_operated"
# expected_actor_id = "github-user-123"
# enabled = true
# repository_id = "987654"
# repository_patterns = ["github.com/example-owner/*"]
# boundary_id = "example-owner"
# capability_ids = ["github.contents.read", "github.contents.write"]
# github_host = "github.com"
# github_login = "example-user"
# transport_kind = "https"
# https_token_environment = "REPOFORGE_GH_PERSONAL_TOKEN"
# credential_fingerprint = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
# allowed_access = ["read", "write"]
# lease_seconds = 300

[[repo]]
id = "example-repository"
path = "/absolute/path/to/repository"

# The generated reviewed lock expands all policy settings. Source onboarding defaults
# to the standard template; a path-only resolved repository defaults to strict.
# Use policy_overrides only after review.
# policy_template = "strict"
# decisions = []
# policy_overrides = []

# Reviewed policy customizations (custom profiles, diagnostics, formatters) live in a
# durable per-repository patch that survives `rf repo refresh`. The `repo_policy`
# preview/apply flow writes reviewed changes; edit by hand only with review.
# [repo.policy_patch]
# execution_mode = "relaxed"
# adhoc_runners = ["uv", "python3", "make"]
# adhoc_timeout_seconds = 600
# remove_profiles = []
# [repo.policy_patch.profiles.debug]
# description = "One-off debug run"
# verification = false
# commands = [["pnpm", "run", "debug:server"]]

# An authoritative gate is expensive enough that the decision to run it is the operator's,
# not the model's. `model_invocable = false` keeps the profile available to you and to CI
# while refusing a model-initiated run at the boundary, and `min_interval_seconds` puts a
# floor under `force_rerun`, which legitimately exists for external changes and is also what
# turns a long gate into something repeatable at will. Give the model a cheap profile to use
# instead -- a scoped, affected-tests run answers in minutes rather than half an hour.
# [repo.policy_patch.profiles.gate]
# description = "Authoritative production gate: full suite with coverage, build, wheel check"
# verification = true
# timeout_seconds = 1800
# model_invocable = false
# min_interval_seconds = 900
# commands = [["scripts/verify-production.sh", "--allow-dirty"]]

# The rung between them is what a model should reach for before opening a pull request: it
# runs everything a change can break -- contracts, corpora and control-plane fault gates,
# lint, strict types, and the whole test suite -- and leaves the branch-coverage floor, the
# builds and the installed-wheel smoke to the release gate and to CI, which already run them
# on every push. Time it on your own machine before choosing `timeout_seconds`: this suite is
# git-subprocess-bound, so it is far more sensitive to what else is running than to core count.
# [repo.policy_patch.profiles.verify]
# description = "Everything a change can break; no coverage floor, build, or wheel smoke"
# verification = true
# timeout_seconds = 1800
# commands = [["scripts/verify-change.sh"]]
# [repo.policy_patch.profiles.dev]
# description = "Affected tests only, no coverage: the profile a model should reach for"
# verification = true
# timeout_seconds = 600
# commands = [["uv", "run", "python", "scripts/select_affected_tests.py", "--run"]]

# Generated paths name an approved regeneration command. Refresh conflict evidence points agents
# at this command instead of encouraging hand-merges.
#
# Declare EVERY path the command writes. A refresh regenerates, then fails closed if the command
# touched a path no rule names -- it cannot tell an approved output from a stray write. One missing
# glob therefore blocks the refresh outright, and the only way through is to add the rule and
# activate a new generation. `make schemas` in this repository writes three paths, not one.
#
# This file is one of two ways these rules arrive, and the other is the common one: the
# `repo_policy` tool (preview, then apply with the returned token) declares them without editing
# any file. Its `generated_paths` REPLACES the whole set rather than adding to it, so an apply must
# carry every rule the repository should end up with. Because broadening policy is a capability
# expansion, the result is `pending_approval` until an operator approves it in the terminal --
# which means a live installation's rules may not appear in any config file at all, and
# `rf show-config` is the authority on what is actually in force.
# [[repositories.example-repository.generated_paths]]
# glob = "docs/contracts/tool-schemas-v2.json"
# regeneration_command = ["make", "schemas"]
# description = "Generated Forge v2 tool schema bundle"
# [[repositories.example-repository.generated_paths]]
# glob = "docs/contracts/release-contract-v2.json"
# regeneration_command = ["make", "schemas"]
# description = "Generated compact release contract"
# [[repositories.example-repository.generated_paths]]
# glob = "src/repoforge/contracts/generated_contract_identity.py"
# regeneration_command = ["make", "schemas"]
# description = "Generated contract identity digests"

# GitHub issue writes are explicit per-repository authority. Comment is the safe default; enable
# close/reopen/link/create only after review. Project V2 writes are never enabled here.
# [repositories.example-repository.issue_writes]
# enabled_ops = ["comment"]
# approval_required_ops = []
# max_writes_per_call = 2
# max_writes_per_window = 20
# window_seconds = 3600
# create_title_prefix = "[TASK]"
# create_body_template = "## Objective\n{body}\n\n## Evidence\n{evidence_ref}"
